<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whale Bets</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 25px;
      text-align: center;
      background: #181818;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitulo {
      color: #aaa;
      margin-top: 8px;
    }

    .filtro {
      text-align: center;
      padding: 20px;
      background: #151515;
    }

    .valor {
      font-size: 26px;
      font-weight: bold;
    }

    #status {
      margin-top: 8px;
      color: #aaa;
    }

    #bets {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .aposta {
      background: #1c1c1c;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      border: 1px solid #333;
    }

    .valor-aposta {
      font-size: 25px;
      font-weight: bold;
    }

    .detalhes {
      color: #bbb;
      margin-top: 10px;
      line-height: 1.6;
    }

    .atualizar {
      display: block;
      margin: 10px auto 25px;
      padding: 12px 25px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>🐋 Whale Bets</h1>
  <div class="subtitulo">Apostas de alto valor</div>
</header>

<div class="filtro">
  <div class="valor">US$ 100.000+</div>
  <div>Últimas 24 horas</div>
  <div id="status">Carregando...</div>
</div>

<button class="atualizar" onclick="carregarApostas()">
  🔄 Atualizar apostas
</button>

<div id="bets"></div>

<script>
const API = "https://whale-bets.onrender.com/bets";

async function carregarApostas() {
  const status = document.getElementById("status");
  const container = document.getElementById("bets");

  status.textContent = "Atualizando...";

  try {
    const resposta = await fetch(API);

    if (!resposta.ok) {
      throw new Error("Erro ao consultar servidor");
    }

    const apostas = await resposta.json();

    container.innerHTML = "";

    if (apostas.length === 0) {
      container.innerHTML = `
        <div class="aposta">
          Nenhuma aposta acima de US$ 100.000 nas últimas 24 horas.
        </div>
      `;
    }

    apostas.forEach(aposta => {
      const data = new Date(aposta.timestamp);

      container.innerHTML += `
        <div class="aposta">
          <div class="valor-aposta">
            US$ ${Number(aposta.amount_usd).toLocaleString("en-US")}
          </div>

          <div class="detalhes">
            🐋 Apostador: ${aposta.bettor || "Desconhecido"}<br>
            ⚽ Esporte: ${aposta.sport || "-"}<br>
            🎯 Mercado: ${aposta.market || "-"}<br>
            📈 Odd: ${aposta.odds || "-"}<br>
            🕐 ${data.toLocaleString("pt-BR")}
          </div>
        </div>
      `;
    });

    status.textContent =
      ${apostas.length} aposta(s) encontrada(s);

  } catch (erro) {
    console.error(erro);
    status.textContent = "Erro ao conectar ao servidor.";
  }
}

carregarApostas();

// Atualiza automaticamente a cada 60 segundos
setInterval(carregarApostas, 60000);
</script>

</body>
</html>
